{% load static %}

<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Django Markdown</title>
    <link href="{% static 'css/md_app.css' %}" rel="stylesheet" />
  </head>
  <body>
    <script src="{% static 'js/md_app.js' %}"></script>    <div class="header">
      <h1>{{ markdown_content.title }}</h1>
    </div>
    <div class="sandbox-wrapper">
      <div class="sandbox">{{ markdown_content.content|safe }}</div>
    </div>
  </body>
</html>
