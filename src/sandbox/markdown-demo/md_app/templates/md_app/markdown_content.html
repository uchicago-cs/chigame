<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Django Markdown</title>
    <style>
      html,
      body {
        padding: 0;
        margin: 0;
        height: 100%;
        font-family: sans-serif;
        background-color: #eee;
        display: flex;
        flex-direction: column;
      }

      .header {
        background-color: dimgray;
        padding: 4px 24px;
        color: #ddd;
        /* https://getcssscan.com/css-box-shadow-examples, shadow #1 */
        box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
        z-index: 2;
      }

      .sandbox-wrapper {
        width: 80%;
        margin-left: auto;
        margin-right: auto;
        background-color: #fff;
        position: relative;
        padding-top: 0;
        margin-top: 0;
        overflow: auto;
        padding-left: 8px;
        padding-right: 8px;
        flex-grow: 1;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>{{ markdown_content.title }}</h1>
    </div>
    <div class="sandbox-wrapper">
      <div class="sandbox">{{ markdown_content.content|safe }}</div>
    </div>
  </body>
</html>
