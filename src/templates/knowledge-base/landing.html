{% extends "knowledge-base/base.html" %}

{% block page-content %}
  <h1>Guide List</h1>
  <div class="grid-container">
    {% for guide in guides %}
      <div class="game-card">
        <a href="#">Guide for {{ guide.game_id }}</a>
        <!-- should replace the link with the guide details link in the issue on guide page-->
      </div>
    {% empty %}
      <p>No guides found.</p>
    {% endfor %}
  </div>
{% endblock page-content %}
