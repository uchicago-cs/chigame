{% extends "knowledge-base/base.html" %}

{% load static %}

{% block page-content %}
  <h2>Feedback</h2>
  {% if submitted %}<p>Thank you for your feedback!</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <textarea name="feedback" rows="4" required></textarea>
    <br />
    <button type="submit">Submit</button>
  </form>
{% endblock page-content %}
