{% extends "knowledge-base/base.html" %}

{% load static %}

<link rel="stylesheet" href="{% static 'css/knowledge-base-styles.css' %}" />
{% block page-content %}
  <h1 class="contributor-title">Manage My Guides</h1>
  <a href="{% url 'knowledge-base' %}" class="btn btn-primary mb-4">Create New Guide</a>
  <div class="uploaded-guides-box">
    <div class="uploaded-guides-column guides-col-width border-left-black">
      <div class="column-header border-left-black">Your Guides</div>
      <div class="column-entry-box border-left-black">
        <div class="guide-entry">Example Guide 1</div>
        <div class="guide-entry">Example Guide 2</div>
      </div>
    </div>
    <div class="uploaded-guides-column guides-col-width">
      <div class="column-header">Recent Updates</div>
      <div class="column-entry-box">
        <div class="guide-entry">Last Updated: 110 BCE</div>
        <div class="guide-entry">Last Updated: Now</div>
      </div>
    </div>
    <div class="uploaded-guides-column guides-col-wide border-right-black">
      <div class="column-header border-right-black">Status</div>
      <div class="column-entry-box border-right-black">
        <div class="guide-entry">Pending</div>
        <div class="guide-entry">Accepted</div>
      </div>
    </div>
  </div>
{% endblock page-content %}
