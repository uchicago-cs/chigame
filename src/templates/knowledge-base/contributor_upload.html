{% extends "knowledge-base/base.html" %}

{% load static %}

{% block css %}
  {{ block.super }}
  <link href="{% static 'css/knowledge-base/guide-upload.css' %}"
        rel="stylesheet" />
{% endblock css %}
{% block page-content %}
  <h2>
    {% if guide %}
      Reupload
    {% else %}
      Upload
    {% endif %}
    Guide
  </h2>
  <div class="form-float-container">
    <div class="form-container">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <label class="file-upload" for="id_file">
          <p class="psuedo-icon">↑</p>
          Click upload a file, or drag and drop
        </label>
        <button type="submit">
          {% if guide %}
            Update <span class="icon">→</span>
          {% else %}
            Upload <span class="icon">→</span>
          {% endif %}
        </button>
      </form>
    </div>
  </div>
{% endblock page-content %}
