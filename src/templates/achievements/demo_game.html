{% extends "base.html" %}

{% block css %}
  {{ block.super }}
  <style>
    .container {
      position: relative;
      display: flex;
    }

    .button {
      cursor: pointer;
      padding: 15px 32px;
      border: none;
      color: white;
      border-radius: 10px;
    }

    .button1 {
      background-color: #851d15;
      position: relative;
      top: 220px;
      left: 80px;
    }

    .button2 {
      background-color: #157885;
      position: relative;
      top: 380px;
      left: 200px;
    }

    .button3 {
      background-color: #558a2b;
      position: relative;
      top: 50px;
      left: 100px;
    }

    .button4 {
      background-color: #4543a1;
      position: relative;
      top: 120px;
      left: 400px;
    }

    .button5 {
      background-color: #d47a13;
      position: relative;
      top: 232px;
      left: 20px;
    }

    .button6 {
      background-color: #d4136d;
      position: relative;
      top: 300px;
      left: 321px;
    }

    .popup {
      opacity: 0;
      transform: translate(-50%, -50%) translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      position: fixed;
      top: 50%;
      left: 50%;
      background: white;
      border-radius: 1rem;
      padding: 1rem;
      border: solid;
      border-radius: 1rem;
      pointer-events: none; /* ignore mouse events when hidden */
      /* Keep popup in the layout but invisible */
    }

    .popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) translateY(0);
      pointer-events: auto; /* enable mouse events when visible */
    }

    .popup.hide {
      opacity: 0;
      transform: translate(-50%, -50%) translateY(20px); /* slide back down */
    }
  </style>
{% endblock css %}
{% load static %}

{% block content %}
  <body>
    <form method="post" id="apiForm">
      {% csrf_token %}
      <button type="submit" class="button button1">Click here</button>
      <button type="submit" class="button button2">Click here</button>
      <button type="submit" class="button button3">Click here</button>
      <button type="submit" class="button button4">Click here</button>
      <button type="submit" class="button button5">Click here</button>
      <button type="submit" class="button button6">Click here</button>
    </form>
    <div id="popup1" class="popup">
      Achievement&nbsp;<b>Click a button</b>&nbsp;earned!
    </div>
    <div id="popup2" class="popup">
      Achievement&nbsp;<b>Click a button five times</b>&nbsp;earned!
    </div>
    <script>
      // Get both popups
      const popup1 = document.getElementById('popup1');
      const popup2 = document.getElementById('popup2');
      const form = document.getElementById('apiForm');
      let count = 0;

      function showPopup(popup) {
        popup.classList.add('show');

        // Hide the popup after 3 seconds
        setTimeout(() => {
          hidePopup(popup);
        }, 3000);
      }

      function hidePopup(popup) {
        popup.classList.remove('show');

        // Wait for the fade-out to finish before hiding
        setTimeout(() => {
          popup.style.display = 'none';
        }, 500); // match the transition duration
      }

      const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
      form.addEventListener('submit', function(event) {
        event.preventDefault();

        // Increment count every time a button is clicked
        count++;
        console.log(count);

        const formData = new FormData(form);
        const data = {};
        formData.forEach((value, key) => {
          data[key] = value;
        });

        // Award the threshold achievement if 5 clicks have been registered
        if (count == 5) {
          fetch('api/award-threshold-achievement/', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
              },
              credentials: 'include',
              body: JSON.stringify(data)
            })
            .then(response => {
              if (!response.ok) {
                throw new Error('Network response was not ok');
              }
              return response.json();
            })
            .then(data => {
              console.log('Success:', data);
              console.log(data.message)
              if (data.message === "T") {
                console.log("showing popup");
                showPopup(popup2);
              } else {
                console.log("not showing popup");
              }
            })
            .catch(error => {
              console.error('Error:', error);
            });
        } else {
          fetch('api/award-achievement/', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
              },
              credentials: 'include',
              body: JSON.stringify(data)
            })
            .then(response => {
              if (!response.ok) {
                throw new Error('Network response was not ok');
              }
              return response.json();
            })
            .then(data => {
              console.log('Success:', data);
              console.log(data.message)
              if (data.message === "T") {
                console.log("showing popup");
                showPopup(popup1);
              } else {
                console.log("not showing popup");
              }
            })
            .catch(error => {
              console.error('Error:', error);
            });
        }
      });
    </script>
  </body>
{% endblock content %}
