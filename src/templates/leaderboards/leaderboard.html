<h1>{{ leaderboard.name }}</h1>
<p>{{ leaderboard.description }}</p>
<table>
  <thead>
    <tr>
      <th>Rank</th>
      <th>Player</th>
      <th>Region</th>
    </tr>
  </thead>
  <tbody>
    {% for entry in entries %}
      <tr>
        <td>{{ entry.rank }}</td>
        <td>
          <a href="{% url 'user_profile_view' user_id=entry.user.id %}">{{ entry.user.username }}</a>
        </td>
        <td>{{ entry.user.region }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
