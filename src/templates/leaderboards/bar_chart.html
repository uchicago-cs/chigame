{% extends "base.html" %}

{% block content %}
  <h1>{{ leaderboard.name }}</h1>

  <div style="margin-bottom: 20px;">
    <a href="{% url 'bar_chart' game.id %}" class="btn btn-primary {% if 'Points' in score_metric_name %}active{% endif %}">Points</a>
    <a href="{% url 'top_time_played_bar_chart' game.id %}" class="btn btn-primary {% if 'Time' in score_metric_name %}active{% endif %}">Time Played</a>
    <a href="{% url 'top_games_won_bar_chart' game.id %}" class="btn btn-primary {% if 'Games Won' in score_metric_name %}active{% endif %}">Games Won</a>
  </div>

  {% if leaderboard_data %}
    <canvas id="leaderboardChart" width="400" height="300"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const leaderboardData = {
        labels: [{% for data in leaderboard_data %} '{{ data.player }}', {% endfor %}],
        datasets: [{
          label: '{{ score_metric_name }}',
          data: [{% for data in leaderboard_data %} {{ data.score }}, {% endfor %}],
          backgroundColor: 'rgba(128, 0, 0, 0.8)',
          borderColor: 'rgba(128, 0, 0, 1)',
          borderWidth: 1
        }]
      };

      const config = {
        type: 'bar',
        data: leaderboardData,
        options: {
          indexAxis: 'y',
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: '{{ score_metric_name }}'
              }
            },
            x: {
              title: {
                display: true,
                text: 'Player'
              }
            }
          }
        },
      };

      const leaderboardChart = new Chart(
        document.getElementById('leaderboardChart'),
        config
      );
    </script>
  {% else %}
    <p>No leaderboard data available for {{ score_metric_name }}.</p>
  {% endif %}
{% endblock content %}
