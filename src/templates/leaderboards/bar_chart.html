{% extends "base.html" %}

{% block content %}
  <h1>{{ leaderboard.name }}</h1>

  <div style="margin-bottom: 20px;">
    <a href="{% url 'points_bar_chart' game.id %}"
       class="btn {% if 'Points' in score_metric_name %}btn-dark active{% else %}btn-outline-dark{% endif %}">
       Points
    </a>
    <a href="{% url 'top_time_played_bar_chart' game.id %}"
       class="btn {% if 'Time' in score_metric_name %}btn-dark active{% else %}btn-outline-dark{% endif %}">
       Time Played (min)
    </a>
    <a href="{% url 'top_games_won_bar_chart' game.id %}"
       class="btn {% if 'Games Won' in score_metric_name %}btn-dark active{% else %}btn-outline-dark{% endif %}">
       Games Won
    </a>
  </div>

  {% if leaderboard_data %}
    <canvas id="leaderboardChart" width="800" height="400"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const leaderboardData = {
        labels: [{% for data in leaderboard_data %}
            '{{ data.tier_badge }} #{{ forloop.counter }}. {{ data.player }}',
            {% endfor %}],
        datasets: [{
          label: '{{ score_metric_name }}',
          data: [{% for data in leaderboard_data %}
            {{ data.score }},
            {% endfor %}],
          backgroundColor: (context) => {
            const chart = context.chart;
            const { ctx, chartArea } = chart;
            if (!chartArea) return 'rgb(128, 0, 0)';
            const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
            gradient.addColorStop(0, 'rgba(255, 99, 132, 0.8)');
            gradient.addColorStop(1, 'rgba(54, 162, 235, 0.8)');
            return gradient;
          },
          borderColor: 'rgba(128, 0, 0, 1)',
          borderWidth: 1,
          barThickness: 100,
          borderRadius: 5,
          hoverBackgroundColor: 'rgba(255, 99, 132, 0.6)',
          hoverBorderColor: 'rgba(255, 99, 132, 1)',
          hoverBorderWidth: 2,
        }]
      };

      const config = {
        type: 'bar',
        data: leaderboardData,
        options: {
          indexAxis: 'y',
          responsive: true,
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: false,
              },
              ticks: {
                font: {
                  size: 18,
                  weight: 'bold',
                },
                padding: 10,
              }
            },
            x: {
              title: {
                display: false,
              },
              ticks: {
                font: {
                  size: 14,
                },
                padding: 10,
              }
            }
          },
          plugins: {
            legend: {
              display: false,
            },
            tooltip: {
              backgroundColor: 'rgba(0, 0, 0, 0.7)',
              titleColor: 'rgba(255, 255, 255, 1)',
              bodyColor: 'rgba(255, 255, 255, 1)',
              borderColor: 'rgba(255, 99, 132, 0.8)',
              borderWidth: 1,
            }
          },
          animation: {
            duration: 1500,
            easing: 'easeOutBounce',
          }
        }
      };

      const leaderboardChart = new Chart(
        document.getElementById('leaderboardChart'),
        config
      );
    </script>
  {% else %}
    <p>No leaderboard data available for {{ score_metric_name }}.</p>
  {% endif %}
{% endblock content %}
