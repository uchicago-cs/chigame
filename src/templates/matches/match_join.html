{% extends "base.html" %}

{% load static %}

{% block content %}
  <div class="container my-5">
    <h1 class="mb-4">Join Match</h1>
    <form method="post" class="needs-validation" novalidate>
      {% csrf_token %}
      <div class="row g-3">
        <!-- Lobby Code -->
        <div class="col-md-6 mb-3">
          <label for="lobby_code" class="form-label">Lobby Code</label>
          <input type="text"
                 name="lobby_code"
                 id="lobby_code"
                 class="form-control"
                 required
                 placeholder="Enter lobby code" />
          {% if form.lobby_code.errors %}<div class="text-danger">{{ form.lobby_code.errors }}</div>{% endif %}
        </div>
        <!-- Submit button -->
        <div class="col-12 mt-4">
          <button type="submit" class="btn btn-primary">Join Match</button>
        </div>
      </div>
    </form>
  </div>
  {% block extra_css %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet" />
  {% endblock extra_css %}
  {% block extra_js %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% endblock extra_js %}
{% endblock content %}
