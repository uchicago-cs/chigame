{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}
  Create a New Group
{% endblock title %}
{% block content %}
  <h1>Create a New Group</h1>
  <form class="form-horizontal"
        method="post"
        action="{% url 'users:group-create' %}">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="control-group">
      <div class="controls">
        <button type="submit" class="btn btn-primary">Create Group</button>
        <a href="{% url 'users:group-list' %}" class="btn btn-secondary ml-2">Back to Group List</a>
      </div>
    </div>
  </form>
{% endblock content %}
