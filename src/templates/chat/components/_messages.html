<style>
  .chat-history {
    border: 1px solid #e1e1e1;
    border-radius: 8px;
    background-color: #f9f9f9;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-history__container {
    height: 100%;
    overflow-y: auto;
    padding: 15px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .chat-message {
    margin-bottom: 12px;
    padding: 10px;
    border-radius: 8px;
    max-width: 80%;
    word-break: break-word;
  }

  .chat-message--mine {
    background-color: #dcf8c6;
    margin-left: auto;
    margin-right: 10px;
    align-self: flex-end;
  }

  .chat-message--other {
    background-color: #ffffff;
    margin-right: auto;
    margin-left: 10px;
    align-self: flex-start;
    border: 1px solid #e1e1e1;
  }

  .chat-message__sender {
    font-weight: bold;
    margin-bottom: 4px;
    font-size: 0.9em;
    color: #800000;
    /* ChiGame brand color */
  }

  .chat-message__content {
    font-size: 1em;
    line-height: 1.4;
  }

  .chat-message__timestamp {
    font-size: 0.7em;
    color: #888;
    text-align: right;
    margin-top: 4px;
  }

  .chat-history__empty {
    text-align: center;
    color: #888;
    padding: 20px;
    font-style: italic;
  }
</style>
<div id="message-container"
     class="chat-messages-scroll flex-grow-1 overflow-auto p-3 bg-light d-flex flex-column">
  <div id="message-container" class="d-flex flex-column h-100">
    {% if messages %}
      {% for message in messages %}
        <div class="mb-3 {% if message.user == request.user %}align-self-end{% else %}align-self-start{% endif %}">
          <div class="{% if message.user == request.user %}bg-success-subtle{% else %}bg-white{% endif %} rounded p-2 shadow-sm">
            <div class="fw-bold small text-danger">{{ message.user.username }}</div>
            <div class="mt-1">{{ message.content }}</div>
            <div class="text-end text-muted small mt-1">{{ message.created_at|date:"g:i A" }}</div>
          </div>
        </div>
      {% endfor %}
    {% else %}
      <div class="text-center text-muted fst-italic p-4">No messages yet. Start the conversation!</div>
    {% endif %}
  </div>
</div>
