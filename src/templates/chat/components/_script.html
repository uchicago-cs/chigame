<script>
  // Hide any alert messages as soon as the page loads
  document.addEventListener('DOMContentLoaded', function() {
    const alerts = document.querySelectorAll('.alert');
    alerts.forEach(alert => {
      alert.style.display = 'none';
    });
  });

  const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
  const chatId = "{{ chat.id }}"; // Make sure to pass chat.id from your view
  const chatSocket = new WebSocket(
    protocol + window.location.host + "/ws/chat/" + chatId + "/"
  );

  chatSocket.onopen = function(e) {
    console.log("Connected to chat room:", chatId);
  };

  chatSocket.onclose = function(e) {
    console.log("Disconnected from chat room:", chatId);
  };

  document.querySelector("#id_message_send_input").focus();
  document.querySelector("#id_message_send_input").onkeyup = function(e) {
    if (e.key === "Enter") {
      document.querySelector("#id_message_send_button").click();
    }
  };

  document.querySelector("#id_message_send_button").onclick = function(e) {
    var messageInput = document.querySelector("#id_message_send_input").value;
    if (messageInput.trim() === "") return;

    chatSocket.send(
      JSON.stringify({
        message: messageInput,
        user_id: "{{ request.user.id }}",
      })
    );
  };

  chatSocket.onmessage = function(e) {
    const data = JSON.parse(e.data);
    var div = document.createElement("div");
    div.className = "chat-message chat-message--mine";
    
    var sender = document.createElement("div");
    sender.className = "chat-message__sender";
    sender.textContent = data.username;
    
    var content = document.createElement("div");
    content.className = "chat-message__content";
    content.textContent = data.message;
    
    var timestamp = document.createElement("div");
    timestamp.className = "chat-message__timestamp";
    timestamp.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    
    div.appendChild(sender);
    div.appendChild(content);
    div.appendChild(timestamp);
    
    document.querySelector("#id_message_send_input").value = "";
    document.querySelector(".chat-history__container").appendChild(div);

    // Scroll to bottom of chat
    const container = document.querySelector(".chat-history__container");
    container.scrollTop = container.scrollHeight;
  };
</script>
