<!-- Context Menu -->
<div id="contextMenu" class="context-menu">
  <div class="small text-muted mb-1" id="replyPreview"></div>
  <button class="btn btn-sm btn-light w-100" onclick="deleteMessage()">Pinning Messages</button>
  <button class="btn btn-sm btn-light w-100" onclick="replyToMessage()">Reply</button>
  <button class="btn btn-sm btn-light w-100" onclick="deleteMessage()">Edit Message</button>
  <button class="btn btn-sm btn-danger w-100" onclick="deleteMessage()">Delete</button>
</div>
<script>
  let replyToMessageId = null;
  let replyToUsername = null;
  let replyToContent = null;

  function showContextMenu(event, messageId, username, content) {
    const contextMenu = document.getElementById('contextMenu');
    const replyPreview = document.getElementById('replyPreview');

    // Store reply information
    replyToMessageId = messageId;
    replyToUsername = username;
    replyToContent = content;

    // Update preview
    replyPreview.textContent = `Replying to ${username}: ${content}`;

    // Position and show menu
    contextMenu.style.left = event.pageX + 'px';
    contextMenu.style.top = event.pageY + 'px';
    contextMenu.style.display = 'block';

    // Hide menu when clicking elsewhere
    document.addEventListener('click', hideContextMenu);
  }

  function hideContextMenu() {
    const contextMenu = document.getElementById('contextMenu');
    contextMenu.style.display = 'none';
    document.removeEventListener('click', hideContextMenu);
  }

  function replyToMessage() {
    const input = document.getElementById('id_message_send_input');
    input.focus();
    hideContextMenu();
  }

  /**
   * Deletes a message on the frontend.
   */
  function deleteMessage() {
    const messageId = replyToMessageId;
    fetch(`/chat/message/${messageId}/delete`, {
      method: 'GET',
    }).then(response => {
      if (response.ok) {
        const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
        if (messageElement) {
          messageElement.remove();
        }
      } else {
        console.error('Failed to delete message');
      }
    });
  }
</script>
