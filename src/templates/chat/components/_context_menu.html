<div id="contextMenu" class="context-menu">
  <div class="small text-muted mb-1" id="replyPreview"></div>
  <button class="btn btn-sm btn-light w-100" onclick="pinningMessage()">Pinning Messages</button>
  <button class="btn btn-sm btn-light w-100" onclick="replyToMessage()">Reply</button>
  <button class="btn btn-sm btn-light w-100"
          onclick="editMessage(replyToMessageId, replyToContent)">Edit Message</button>
  <button class="btn btn-sm btn-light w-100" onclick="reactToMessage()">React to Message</button>
  <button class="btn btn-sm btnlight w-100" onclick="reactToMessage('❤️')">Add Reactions</button>
  <button class="btn btn-sm btn-danger w-100"
          onclick="deleteMessage()"
          title="Delete Message">Delete Message</button>
</div>
{% csrf_token %}
<script>
  function showContextMenu(event, messageId, username, content) {
    const contextMenu = document.getElementById('contextMenu');
    const replyPreview = document.getElementById('replyPreview');

    // Store reply information
    replyToMessageId = messageId;
    replyToUsername = username;
    replyToContent = content;

    // Update preview
    replyPreview.textContent = `Replying to ${username}: ${content}`;

    // Position and show menu
    contextMenu.style.left = event.pageX + 'px';
    contextMenu.style.top = event.pageY + 'px';
    contextMenu.style.display = 'block';

    // Hide menu when clicking elsewhere
    document.addEventListener('click', hideContextMenu);
  }

  function hideContextMenu() {
    const contextMenu = document.getElementById('contextMenu');

    contextMenu.style.display = 'none';
    document.removeEventListener('click', hideContextMenu);
  }

  function editMessage(messageId, content) {
    // 🧹 Clear accidental reply state
    replyToMessageId = null;
    replyToUsername = null;
    replyToContent = null;
    document.getElementById("replying-to-preview").classList.add("d-none");

    const inputElement = document.getElementById("id_message_send_input");
    inputElement.value = content || "";
    inputElement.focus();

    const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
    const contentElement = messageElement?.querySelector(".mt-1");
    const oldContent = contentElement?.innerText || "";

    const newContent = prompt("Edit your message:", oldContent);
    if (!newContent) return;

    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    fetch(`/chat/message/${messageId}/edit`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'X-CSRFToken': csrfToken
        },
        body: `content=${encodeURIComponent(newContent)}`
      })
      .then(response => response.json())
      .then(data => {
        if (data.message === "Message edited successfully" && data.edited === true) {
          if (contentElement) {
            contentElement.innerText = newContent;
          }

          const existingTag = messageElement.querySelector(".edited-tag");
          if (existingTag) existingTag.remove();

          const editedTag = document.createElement("div");
          editedTag.className = "text-end text-muted small mt-1 edited-tag fst-italic";
          editedTag.innerText = "(edited)";
          messageElement.appendChild(editedTag);
        } else {
          console.error('Failed to edit message');
        }
      })
      .catch(error => {
        console.error('Error editing message:', error);
      });

    hideContextMenu();
  }


  /**
   * Focuses on the message input field and hides the context menu.
   */
  function replyToMessage() {
    const input = document.getElementById('id_message_send_input');

    input.focus();
    hideContextMenu();

    document.getElementById('replying-to-preview').classList.remove('d-none');
    document.getElementById('preview-username').textContent = replyToUsername;
    document.getElementById('preview-content').textContent = replyToContent;
  }

  /**
   * Performs an eager delete of a message by removing the message from the DOM
   * and then sending a GET request to the delete-message endpoint.
   */
  function deleteMessage() {
    const messageId = replyToMessageId;
    fetch(`/chat/message/${messageId}/delete`, {
      method: 'GET',
    }).then(response => {
      if (response.ok) {
        const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
        if (messageElement) {
          messageElement.remove();
        }
      } else {
        console.error('Failed to delete message');
      }
    });
  }

  /**
   * Reacts to a message on the frontend.
   */
  function reactToMessage(content = "❤️") {
    const messageId = replyToMessageId;
    replyToMessageId = null;
    replyToUsername = null;
    replyToContent = null;
    const inputElement = document.getElementById("id_message_send_input");
    inputElement.value = "";

    inputElement.focus();
    document.getElementById("replying-to-preview").classList.add("d-none");
    console.log("reacting to message");
    try {

      fetch(`/chat/message/${messageId}/react`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: `message_id=${messageId}&content=${encodeURIComponent(content)}`
        })
        .then(response => response.json())
        .then(data => {
          if (data.status === "reacted") {
            addReactionToMessage(messageId, content);
          } else if (data.status === "unreacted") {
            removeReactionFromMessage(messageId, content); // <- fixed name
          }
        });
    } catch (e) {
      console.error("ERROR: " + e.message);
    }
    hideContextMenu();
  }

  function addReactionToMessage(messageId, content) {
    const container = document.getElementById(`reactions-${messageId}`);
    if (!container) return;

    const existing = container.querySelector(`[data-reaction="${content}"]`);
    if (existing) {
      const countSpan = existing.querySelector('.reaction-count');
      const count = parseInt(countSpan.textContent, 10);
      countSpan.textContent = count + 1;
    } else {
      const span = document.createElement('span');
      span.className = 'reaction-pill';
      span.dataset.reaction = content;
      span.dataset.messageId = messageId;
      span.innerHTML = `${content} <span class="reaction-count">1</span>`;
      span.onclick = () => reactToMessage(content, messageId);
      container.appendChild(span);
    }
  }

  function removeReactionFromMessage(messageId, content) {
    const container = document.getElementById(`reactions-${messageId}`);
    if (!container) return;

    const existing = container.querySelector(`[data-reaction="${content}"]`);
    if (existing) {
      const countSpan = existing.querySelector('.reaction-count');
      const count = parseInt(countSpan.textContent, 10);
      if (count > 1) {
        countSpan.textContent = count - 1;
      } else {
        existing.remove();
      }
    }
  }

  function pinningMessage() {
    hideContextMenu();

  }
</script>
