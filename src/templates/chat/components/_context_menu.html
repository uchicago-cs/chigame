<div id="contextMenu" class="context-menu">
  <div class="small text-muted mb-1" id="replyPreview"></div>
  <button class="btn btn-sm btn-light w-100"
          onclick="deleteMessage()"
          title="Pinning Messages">Pinning Messages</button>
  <button class="btn btn-sm btn-light w-100"
          onclick="replyToMessage()"
          title="Reply">Reply</button>
  <button class="btn btn-sm btn-light w-100"
          onclick="editMessage()"
          title="Edit Message">Edit Message</button>
  <button class="btn btn-sm btn-danger w-100"
          onclick="deleteMessage()"
          title="Delete Message">Delete Message</button>
</div>
{% csrf_token %}
<script>
  let replyToMessageId = null;
  let replyToUsername = null;
  let replyToContent = null;

  function showContextMenu(event, messageId, username, content) {
    const contextMenu = document.getElementById('contextMenu');
    const replyPreview = document.getElementById('replyPreview');

    // Store reply information
    replyToMessageId = messageId;
    replyToUsername = username;
    replyToContent = content;

    // Update preview
    replyPreview.textContent = `Replying to ${username}: ${content}`;

    // Position and show menu
    contextMenu.style.left = event.pageX + 'px';
    contextMenu.style.top = event.pageY + 'px';
    contextMenu.style.display = 'block';

    // Hide menu when clicking elsewhere
    document.addEventListener('click', hideContextMenu);
  }

  function hideContextMenu() {
    const contextMenu = document.getElementById('contextMenu');

    contextMenu.style.display = 'none';
    document.removeEventListener('click', hideContextMenu);
  }

  function editMessage() {
    const messageId = replyToMessageId;
    const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
    const contentElement = messageElement?.querySelector(".mt-1");
    const oldContent = contentElement?.innerText || "";

    const newContent = prompt("Edit your message: ", oldContent);
    if (!newContent) return;


    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    fetch(`/chat/message/${messageId}/edit`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'X-CSRFToken': csrfToken
        },
        body: `content=${encodeURIComponent(newContent)}`
      })
      .then(response => {
        if (response.ok) {
          if (contentElement) {
            contentElement.innerText = newContent;
          }
        } else {
          console.error('Failed to edit message');
        }
      })
      .catch(error => {
        console.error('Error editing message:', error);
      });

    hideContextMenu();
  }

  /**
   * Focuses on the message input field and hides the context menu.
   */
  function replyToMessage() {
    const input = document.getElementById('id_message_send_input');

    input.focus();
    hideContextMenu();
  }

  /**
   * Performs an eager delete of a message by removing the message from the DOM
   * and then sending a GET request to the delete-message endpoint.
   */
  function deleteMessage() {
    const messageId = replyToMessageId;
    fetch(`/chat/message/${messageId}/delete`, {
      method: 'GET',
    }).then(response => {
      if (response.ok) {
        const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
        if (messageElement) {
          messageElement.remove();
        }
      } else {
        console.error('Failed to delete message');
      }
    });
  }
</script>
