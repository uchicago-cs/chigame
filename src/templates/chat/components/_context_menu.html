<!-- Context Menu -->
<div id="contextMenu" class="context-menu">
  <div class="small text-muted mb-1" id="replyPreview"></div>
  <button class="btn btn-sm btn-light w-100" onclick="deleteMessage()">Pinning Messages</button>
  <button class="btn btn-sm btn-light w-100" onclick="replyToMessage()">Reply</button>
  <button class="btn btn-sm btn-light w-100" onclick="deleteMessage()">Edit Message</button>
  <button class="btn btn-sm btnlight w-100" onclick="reactToMessage('❤️')">Add Reactions</button>
  <button class="btn btn-sm btn-danger w-100" onclick="deleteMessage()">Delete</button>
</div>
<script>
  let replyToMessageId = null;
  let replyToUsername = null;
  let replyToContent = null;

  function showContextMenu(event, messageId, username, content) {
    const contextMenu = document.getElementById('contextMenu');
    const replyPreview = document.getElementById('replyPreview');

    // Store reply information
    replyToMessageId = messageId;
    replyToUsername = username;
    replyToContent = content;

    // Update preview
    replyPreview.textContent = `Replying to ${username}: ${content}`;

    // Position and show menu
    contextMenu.style.left = event.pageX + 'px';
    contextMenu.style.top = event.pageY + 'px';
    contextMenu.style.display = 'block';

    // Hide menu when clicking elsewhere
    document.addEventListener('click', hideContextMenu);
  }

  function hideContextMenu() {
    const contextMenu = document.getElementById('contextMenu');
    contextMenu.style.display = 'none';
    document.removeEventListener('click', hideContextMenu);
  }

  function replyToMessage() {
    const input = document.getElementById('id_message_send_input');
    input.focus();
    hideContextMenu();

    document.getElementById('replying-to-preview').classList.remove('d-none');
    document.getElementById('preview-username').textContent = replyToUsername;
    document.getElementById('preview-content').textContent = replyToContent;
  }

  /**
   * Deletes a message on the frontend.
   */
  function deleteMessage() {
    const messageId = replyToMessageId;
    fetch(`/chat/message/${messageId}/delete`, {
      method: 'GET',
    }).then(response => {
      if (response.ok) {
        const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
        if (messageElement) {
          messageElement.remove();
        }
      } else {
        console.error('Failed to delete message');
      }
    });
  }

  /**
   * Reacts to a message on the frontend.
   */
  function reactToMessage(content = "❤️") {
    console.log("reacting to message");
    try {
      const messageId = replyToMessageId;
      fetch(`/chat/message/${messageId}/react`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: `message_id=${messageId}&content=${encodeURIComponent(content)}`
        })
        .then(response => response.json())
        .then(data => {
          if (data.status === "reacted") {
            addReactionToMessage(messageId, content);
          } else if (data.status === "unreacted") {
            removeReactionFromMessage(messageId, content); // <- fixed name
          }
        });
    } catch (e) {
      console.error("ERROR: " + e.message);
    }
    hideContextMenu();
  }

  function addReactionToMessage(messageId, content) {
    const container = document.getElementById(`reactions-${messageId}`);
    if (!container) return;

    const existing = container.querySelector(`[data-reaction="${content}"]`);
    if (existing) {
      const countSpan = existing.querySelector('.reaction-count');
      const count = parseInt(countSpan.textContent, 10);
      countSpan.textContent = count + 1;
    } else {
      const span = document.createElement('span');
      span.className = 'reaction-pill';
      span.dataset.reaction = content;
      span.dataset.messageId = messageId;
      span.innerHTML = `${content} <span class="reaction-count">1</span>`;
      span.onclick = () => reactToMessage(content);
      container.appendChild(span);
    }
  }

  function removeReactionFromMessage(messageId, content) {
    const container = document.getElementById(`reactions-${messageId}`);
    if (!container) return;

    const existing = container.querySelector(`[data-reaction="${content}"]`);
    if (existing) {
      const countSpan = existing.querySelector('.reaction-count');
      const count = parseInt(countSpan.textContent, 10);
      if (count > 1) {
        countSpan.textContent = count - 1;
      } else {
        existing.remove();
      }
    }
  }
</script>
