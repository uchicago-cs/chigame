<!-- Context Menu -->
<div id="contextMenu" class="context-menu">
  <div class="small text-muted mb-1" id="replyPreview"></div>
  <button class="btn btn-sm btn-light w-100" onclick="pinMessage()">Pinning Messages</button>
  <button class="btn btn-sm btn-light w-100" onclick="replyToMessage()">Reply</button>
  <button class="btn btn-sm btn-light w-100" onclick="editMessage()">Edit Message</button>
  <button class="btn btn-sm btn-light w-100" onclick="reactToMessage()">React to Message</button>
  <button class="btn btn-sm btn-danger w-100" onclick="deleteMessage()">Delete</button>
</div>
{% csrf_token %}
<script>
  let replyToMessageId = null;
  let replyToUsername = null;
  let replyToContent = null;

  function showContextMenu(event, messageId, username, content) {
    const contextMenu = document.getElementById('contextMenu');
    const replyPreview = document.getElementById('replyPreview');

    // Store reply information
    replyToMessageId = messageId;
    replyToUsername = username;
    replyToContent = content;

    // Update preview
    replyPreview.textContent = `Replying to ${username}: ${content}`;

    // Position and show menu
    contextMenu.style.left = event.pageX + 'px';
    contextMenu.style.top = event.pageY + 'px';
    contextMenu.style.display = 'block';

    // Hide menu when clicking elsewhere
    document.addEventListener('click', hideContextMenu);
  }

  function hideContextMenu() {
    const contextMenu = document.getElementById('contextMenu');
    contextMenu.style.display = 'none';
    document.removeEventListener('click', hideContextMenu);
  }

  function replyToMessage() {
    const input = document.getElementById('id_message_send_input');
    input.focus();
    hideContextMenu();
  }

  /**
   * Deletes a message on the frontend.
   */
  function deleteMessage() {
    const messageId = replyToMessageId;
    fetch(`/chat/message/${messageId}/delete`, {
      method: 'GET',
    }).then(response => {
      if (response.ok) {
        const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
        if (messageElement) {
          messageElement.remove();
        }
      } else {
        console.error('Failed to delete message');
      }
    });
  }



  function pinMessage() {
    const id = replyToMessageId;
    const token = document.querySelector('[name=csrfmiddlewaretoken]').value;

    fetch(`/chat/message/${id}/pin`, {
        method: 'POST',
        headers: {
          'X-CSRFToken': token
        }
      })
      .then(res => res.json())
      .then(data => {
        const pm = data.pinned_message;

        const banner = document.getElementById('pinned-message-container');
        if (pm.is_pinned) {
          banner.innerHTML = `📌 <strong>${pm.username}</strong>: ${pm.content}`;
          banner.style.display = 'block'; // ← this is KEY!
        } else {
          banner.innerHTML = '';
          banner.style.display = 'none';
        }
        document.querySelectorAll('.pinned-label').forEach(el => el.remove());

        if (pm.is_pinned) {
          const messageEl = document.querySelector(
            `[data-message-id="${pm.id}"]`
          );

          // check for .message-meta
          let meta = messageEl?.querySelector('.message-meta');

          if (!meta) {
            // create it if missing
            meta = document.createElement('div');
            meta.className = 'message-meta text-end text-muted small mt-1';



            messageEl?.querySelector('.rounded')?.appendChild(meta);
          }
          meta.insertAdjacentHTML(
            'beforeend',
            `<span class="text-warning small ms-1 pinned-label">📌 Pinned</span>`
          );
        }
      })
      .catch(err => console.error('Pin failed:', err));

    hideContextMenu();
  }



  function editMessage() {
    hideContextMenu();

  }




  function reactToMessage() {
    hideContextMenu();

  }
</script>
