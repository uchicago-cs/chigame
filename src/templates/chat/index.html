{% extends "base.html" %}

{% block content %}
  <style>
    /* Base layout for chat container */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: auto;
      max-height: 80vh;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    /* Layout modes: centered or floating */
    .centered-chat {
      max-width: 600px;
      margin: 0 auto;
    }

    .floating-chat {
      position: fixed;
      bottom: 0;
      right: 50px;
      width: 350px;
      z-index: 1050;
      background: white;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .collapsed-chat #chat-body {
      display: none !important;
    }

    #chat-body {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-messages-scroll {
      flex-grow: 1;
      overflow-y: auto;
    }
  </style>
  <div id="chatContainer" class="chat-container centered-chat">
    {% include "chat/components/_header.html" %}
    <div id="chat-body" class="d-flex flex-column flex-grow-1 overflow-hidden">
      {% include "chat/components/_messages.html" %}
      {% include "chat/components/_input.html" %}
    </div>
    {% include "chat/components/_script.html" %}
  </div>
{% endblock content %}
