{% extends "base.html" %}

{% block content %}
  <input type="text" id="search-input" placeholder="Search...">
  <div class="container">
  <h1>Live Chats</h1>
  <ul>
    {% for chat in chats %}
      <li class="list-group-item">
        <a href="{% url 'chat-page' chat.id %}">{{ chat.name }}</a>
      </li>
    {% endfor %}
  </ul>
  </div>
{% endblock content %}
