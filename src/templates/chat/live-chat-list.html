{% extends "base.html" %}

{% block content %}
  <div class="container mt-4">
    <h2 class="mb-4">Public Chat</h2>
    <div class="list-group">
      {% for chat in chats %}
        <a href="{% url 'chat-page' chat.id %}"
           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
          <div>
            <h5 class="mb-1">{{ chat.name }}</h5>
            <div class="text-muted small">{{ chat.last_message|default:"No messages yet." }}</div>
          </div>
          <span class="badge bg-primary rounded-pill">{{ chat.user_count }} user{{ chat.user_count|pluralize }}</span>
        </a>
      {% endfor %}
    </div>
  </div>
{% endblock content %}
