{% extends "base.html" %}

{% block content %}
  <div class="container">
    <h1>Live Chats</h1>
    <div class="search-container mb-3">
      <input type="text"
             id="search-input"
             class="form-control"
             placeholder="Search public chats..."
             value="{{ request.GET.q|default:'' }}" />
    </div>
    <ul class="list-group">
      {% for chat in chats %}
        <li class="list-group-item">
          <div class="d-flex justify-content-between align-items-center">
            <a href="{% url 'chat-page' chat.id %}">{{ chat.name }}</a>
            <div class="dropdown">
              <button class="btn btn-sm btn-light"
                      type="button"
                      data-bs-toggle="dropdown"
                      aria-expanded="false">⋮</button>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item text-danger"
                     href="#"
                     data-chat-id="{{ chat.id }}"
                     onclick="confirmLeaveChat(this)">Leave Chat</a>
                </li>
              </ul>
            </div>
          </div>
        </li>
      {% endfor %}
    </ul>
    <!-- Leave Chat Confirmation Modal -->
    <div class="modal fade"
         id="confirmLeaveModal"
         tabindex="-1"
         aria-labelledby="confirmLeaveModalLabel"
         aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Leave Chat</h5>
            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"></button>
          </div>
          <div class="modal-body">Are you sure you want to leave this chat?</div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmLeaveBtn">Leave</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    let selectedChatId = null;

    function confirmLeaveChat(element) {
      selectedChatId = element.dataset.chatId;
      const modal = new bootstrap.Modal(document.getElementById('confirmLeaveModal'));
      modal.show();
    }

    document.addEventListener('DOMContentLoaded', function() {
      const searchInput = document.getElementById('search-input');

      const debounce = (func, delay) => {
        let timeout;
        return function(...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(this, args), delay);
        };
      };

      const handleSearchInput = debounce(function() {
        const searchQuery = this.value.trim();
        const currentUrl = new URL(window.location.href);

        if (searchQuery) {
          currentUrl.searchParams.set('q', searchQuery);
        } else {
          currentUrl.searchParams.delete('q');
        }

        window.history.pushState({}, '', currentUrl);

        // Filter the chat list
        const chatItems = document.querySelectorAll('.list-group-item');
        chatItems.forEach(item => {
          const chatName = item.textContent.toLowerCase();
          if (chatName.includes(searchQuery.toLowerCase())) {
            item.style.display = '';
          } else {
            item.style.display = 'none';
          }
        });
      });
      searchInput.addEventListener('input', handleSearchInput);

      const leaveBtn = document.getElementById("confirmLeaveBtn");
      if (leaveBtn) {
        leaveBtn.addEventListener("click", function() {
          if (selectedChatId) {
            window.location.href = `/chat/live-chat-list/leave/${selectedChatId}/`;
          }
        });
      }
    });
  </script>
{% endblock content %}
