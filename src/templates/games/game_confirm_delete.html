{% extends "base.html" %}

{% block content %}
  <div class="container mt-4">
    <h2>Delete Game</h2>
    <p>Are you sure you want to delete "{{ game.name }}"?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'game-detail' game.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
{% endblock content %}
